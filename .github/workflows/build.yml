name: Build 747 Fabric 1.21.1

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate original 747 model, texture and sounds
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 tools/generate_747_assets.py

      - name: Static checks
        run: python3 STATIC_CHECKS.py

      - name: Build mod
        run: gradle clean build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: immersive-aircraft-747-v0.9.0-1.21.1-fabric
          path: build/libs/*.jar
